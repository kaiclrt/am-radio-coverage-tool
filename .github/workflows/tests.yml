name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,api]
          pip install global-land-mask

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/ api/

      - name: Type check with mypy
        run: mypy src/ api/

      - name: Run offline test suite
        run: |
          python -m pytest tests/ --ignore=tests/test_digitizer.py -v

      # test_digitizer.py requires the FCC's source PDFs (not redistributed
      # in this repo - see scripts/digitize_all.py for why), so it can't
      # run in CI. Live network tests (ESA WorldCover queries) are also
      # skipped here since RUN_LIVE_TERRAIN_TESTS is unset by default -
      # they're intended for manual verification, not every CI run, to
      # avoid flaking on network conditions or hitting rate limits.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm install`, not `npm ci`: this project deliberately doesn't keep
      # a lockfile (same reasoning as the Python side's version-ranges-only
      # pyproject.toml - see README "Tested dependency versions"). package.json
      # declares caret ranges; CI resolving them fresh is the intended check.
      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Type-check and build
        run: npm run build
