[project]
name = "am-coverage-tool"
version = "0.1.0"
description = "AM radio ground wave coverage calculator using digitized FCC propagation curves"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
# Version bounds: lower bounds are the oldest version actually tested; upper
# bounds block the next untested major version (numpy 3.x, pymupdf 2.x, etc.)
# rather than pinning exact versions - this project isn't a library other
# packages depend on, so a full lockfile (exact-pinned versions) would add
# more tooling overhead than benefit at this stage. See README.md's
# Installation section for the specific versions this has actually been
# tested against.
dependencies = [
    "pymupdf>=1.24,<2.0",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<10.0", "ruff>=0.16,<1.0", "mypy>=1.10,<2.1"]
terrain = ["rasterio>=1.3,<2.0", "global-land-mask>=1.0,<2.0"]
api = ["flask>=3.0,<4.0", "flask-cors>=4.0,<7.0", "flask-limiter>=3.5,<4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Deliberately conservative selection rather than ruff's full default set:
# E/F = pycodestyle errors + pyflakes (real bugs: unused vars, undefined
#       names, etc.) - the core value of a linter.
# I   = import sorting (isort-equivalent) - mechanical, auto-fixable.
# UP  = pyupgrade - flags outdated syntax patterns for the declared Python
#       version floor.
# Explicitly NOT enabled: S (bandit-style security lint - not a good fit
# for this kind of data-processing tool, and flags intentional patterns
# like broad except Exception in per-bearing/per-file failure isolation
# as if they were bugs), BLE (blind-except - same reasoning), SIM
# (flake8-simplify - stylistic opinions, not correctness).
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# sys.path manipulation before imports is intentional in this project's
# module layout (each propagation/ module inserts its own directory so
# scripts can run them directly without a full package install) - E402
# (module level import not at top of file) is a false positive here.
"src/propagation/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"api/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Lenient rather than --strict, matching the same philosophy as the ruff
# rule selection above: this catches real type inconsistencies (the kind
# that already caught a couple of real issues during initial setup - see
# CHANGELOG.md) without demanding 100% annotation coverage or fighting
# untyped third-party libraries (fitz/pymupdf, rasterio, global-land-mask
# ship no type stubs, hence ignore_missing_imports above).
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
