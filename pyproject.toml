[project]
name = "am-coverage-tool"
version = "0.1.0"
description = "AM radio ground wave coverage calculator using digitized FCC propagation curves"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
terrain = ["rasterio>=1.3", "global-land-mask>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
