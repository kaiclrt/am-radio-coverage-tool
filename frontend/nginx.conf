# `api` below resolves via Docker Compose's service DNS - only valid
# inside the compose network, not for standalone `docker run`.
#
# A static `proxy_pass http://api:5000/...` resolves that hostname once
# (at nginx startup) and caches the IP for the worker's lifetime. Docker
# assigns a *new* internal IP whenever the api container is recreated
# (e.g. `docker compose up -d --build api` after a code change) without
# restarting frontend - confirmed live: every request hung until frontend
# was restarted, with nothing ever reaching the api container's logs.
# Using a variable forces nginx to actually re-resolve via Docker's
# embedded DNS (127.0.0.11) on the `resolver`'s TTL instead.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    location /api/ {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # nginx's 60s default proxy_read_timeout is too tight for the
        # coverage endpoints: terrain.get_conductivity() makes one live
        # network call per sample point (up to ~2000/request - see the
        # combined budget check in api/app.py), so a real request under
        # imperfect network conditions can legitimately run past 60s -
        # confirmed by a request from the frontend hanging past 60s and
        # returning a silent 504 while the same request direct to :5000
        # completed in 13s. Connect stays tight since reaching the api
        # container itself should be near-instant.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
