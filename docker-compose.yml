# Local/demo use: `docker compose up --build`, then open http://localhost:8080
#
# The api service is not meant to be hit directly by a browser in this
# setup - the frontend's nginx proxies /api/* to it server-side (see
# frontend/nginx.conf), so FRONTEND_ORIGIN below only matters if something
# calls localhost:5000 directly (e.g. curl, or a browser tab pointed
# straight at the API for debugging).
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FRONTEND_ORIGIN=http://localhost:8080,http://127.0.0.1:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
